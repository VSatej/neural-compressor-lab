title: Neural Compressor Lab
description: Built a web-based audio compressor application with a Nuxt 3 frontend and Flask backend. Users can upload WAV files, adjust compression settings, listen to processed audio, and inspect audio signal metrics. Exploring the intersection of digital signal processing and machine learning for audio applications.
